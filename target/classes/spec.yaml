openapi: 3.0.1

servers:
    - url: https://{server}/v2024.01
      description: Consent manager for the tenant
      variables:
          server:
              default: cm.*
              description: The server that the API is hosted on.

info:
    title: Consent Manager Apis
    description: |
        This document provides the OAS3 specification for the APIs provided by the Ozone Consent Manager.
        These APIs are implemented by Ozone and should be called by the ASPSP to find, modify and delete consents.
        #### Changes in Release 2024.01.00
        Introduced new object in samaPaymentPatchBody -> `consentBody.Meta` in PATCH `/consents/{consentId}` API.
        
        Introduced new object called `instruction` in response body of PATCH `/payment-log/{paymentId}` API and response body of GET `/payment-log` API as per KSA requirements.
        
        Updated the request body of PATCH `/payment-log/{paymentId}` API
          - Added a new field in samaPaymentPatchBody -> `paymentResponse.rejectionDetails`
              - Added attribute `Reason`
              - Added  attribute `Message`
          - Added a new object in samaPaymentPatchBody -> `paymentResponse.instruction`
        Updated the description of GET '/consents/{consentId}' with brazil consent type
        Added 'ozoneSupplementaryInformation' and 'updatedAt' field in GET '/consents/{consentId}'
        
        
        #### Changes in Release 2023.49
        Updated the request body of PATCH `/consents/{consentId}` API
          - Added a new field in samaPatchBody -> `consentBody.Data.ConsentFlags`
        
        Updated the request body of PATCH `/consents/{consentId}` API
          - Request body of brcbPatchBody
            - Added 'REVOKED' as a new enum  -> `consentBody.data.status`
            - Added new enums in `consentBody.data.rejection.code`
            - Added a new field 'rejectedFrom' in `consentBody.data.rejection`
            - Added a new field 'detail' in `consentBody.data.rejection`
            - Added `consentBody.data.revocation`
            - Added `consentBody.data.riskSignals`
            - Added `consentBody.data.creditors`
            - Added `consentBody.data.startDateTime`
            - Added `consentBody.data.automatic`
        
        #### Changes in Release 2023.48
        
        ##### Payment-Log Patch
        - Introduced payment-log patch API `/payment-log/{payment-id}`
        
        ##### Consent Patch
        Updated `/consents/{consentId}` API to support sama rc-1 AIS changes
        
        - `consentBody.Data.Status` changed to `consentBody.Data.ConsentStatus`
        - `consentBody.Data.StatusUpdateDateTime` changed to `consentBody.Data.ConsentStatusUpdateDateTime`
        
        
        #### Changes in Release 2023.33
        
        ##### Change in version numbering
        The Consent Manager version numbering has been changed to align with the Ozone version numbering.
        This follows the Ozone release number in YYYY.WW format
        
        ##### Consent Groups
        The Consent Manager now supports the concept of consent groups. A consent group is a collection of consents that are related to each other.
        For example, for CDR, the consent group id is used to group together consents that are related to the same arrangement and the consent group id is the arrangement_id
        
        In order to support this functionality, the following changes have been made to the Consent Manager APIs:
        - A new `consentGroupId` field has been added to the `newConsent` object. This field is used to specify the consent group id that the consent belongs to.
        - A new API has been added to retrieve all the consents that belong to a consent group. The API is `/consent-groups/{consentGroupId}/consents`
        
        ##### Consent Status
        The Consent Manager now supports the concept of consent status. The consent status is used to indicate the current state of the consent.
        
        In earlier versions, the disposition of this field depended on the underlying standard. For example, for OBIE, the consent status was stored in the `consentBody.Data.Status` field. For BOBF, the consent status was stored in the `consentBody.Data.Status` field. From this version, the status value is copied across and kept in sync with the `status` field.
        
        As a result, we have introduced the status field as a query criteria to the following APIs:
        - `/consents`
        - `/consent-groups/{consentGroupId}/consents`
        - `/psu/{userId}/consents`
        - `/accounts/{accountId}/consents`
        
        ##### Pagination parameters
        Added clarity on the values that pagination parameters may take
    
    
    

    contact:
        name: Contact your Ozone representative
        url: https://ozoneapi.com

    version: Version 2024.01

tags:
    - name: consents
    - name: consent-groups
    - name: funds-confirmations
    - name: payments
    - name: events

paths:
    /consents:
        post:
            tags:
                - consents
            summary: Creates a new consent
            description: |
                Used by Ozone to create a new consent using a Heimdall interaction.

            operationId: addConsent
            requestBody:
                description: |
                    An end-point for creating a new consent.
                    
                    The consent is created from a Heimdall Interaction that is passed in as the request body.
                    
                    The Consent Manager processes this as a RAR request using one or more plugins to introspect and create the appropriate consent.
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: true

            responses:
                '201':
                    description: |
                        Indicates the successful creation of a consent
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ConsentPostResponse"

                '400':
                    description: |
                        Indicates a failure to create the consent
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

        get:
            tags:
                - consents
            summary: Retrieves all the consents that meet the search criteria
            description: |
                Retrieves an array of consents that meets the search criteria.
                
                If no consents could be found, then an empty array is returned.

            operationId: getAllConsents

            parameters:
                - name: updatedAt
                  in: query
                  schema:
                      type: number
                  required: false
                  description: |
                      Select only consents updated after the specified time

                - $ref: "#/components/parameters/consentType"
                - $ref: "#/components/parameters/status"
                - $ref: "#/components/parameters/page"
                - $ref: "#/components/parameters/pageSize"

            responses:
                '200':
                    description: |
                        Successful response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/multiConsentResponse"
                '400':
                    description: Indicates a failure to retrieve the consents
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

    /consents/{consentId}:
        get:
            tags:
                - consents
            summary: Retrieve a consent by its id
            description: Retrieves a consent by its id.
            operationId: getConsentsByConsentId
            parameters:
                - $ref: "#/components/parameters/consentId"

            responses:
                '200':
                    description: successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - data
                                    - meta
                                properties:
                                    data:
                                        $ref: "#/components/schemas/consent"
                                    meta:
                                        $ref: "#/components/schemas/meta"

                '400':
                    description: |
                        Indicates a failure to retrieve the consent
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

        patch:
            tags:
                - consents
            summary: Patches one or more fields in a consent
            description: |
                This operation allows an ASPSP modify fields within a consent's `consentBody`.
                
                Typically, this API would be called after the PSU has authorised a consent. This would
                allow the ASPSP to "patch in" the `psuIdentifier` and `accountIds` associated with the
                consent
            operationId: patchConsent
            parameters:
                - $ref: "#/components/parameters/consentId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/patchBody"


            responses:
                '204':
                    description: An empty response
                '400':
                    description: |
                        Indicates a failure to patch the consent
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

        delete:
            tags:
                - consents
            summary: deletes the specified consent

            description: |
                Deletes the specified consent.

            operationId: deleteConsent

            parameters:
                - $ref: "#/components/parameters/consentId"

            responses:
                '204':
                    description: |
                        Successful response
                '400':
                    description: Indicates a failure to retrieve the consents
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

    /consents/{consentId}/action/revoke:
        post:
            tags:
                - consents
            summary: Revoke a consent by its id
            description: Revoke a consent by its id.
            operationId: revokeConsentsByConsentId

            parameters:
                - $ref: "#/components/parameters/consentId"

            requestBody:
                description: |
                    An end-point for revoking a consent.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RevokeConsent"

            responses:
                '204':
                    description: |
                        No Content

                '400':
                    description: |
                        Indicates a failure to revoke the consent
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

    /consents/{consentId}/audit:
        get:
            tags:
                - consents
            summary: Retrieve an audit of a consent by the consent's id
            description:
                Retrieves an audit of a consent by the consent's id.
            operationId: getAuditConsentsByConsentId
            parameters:
                - $ref: "#/components/parameters/consentId"

            responses:
                '200':
                    description: successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - data
                                    - meta
                                properties:
                                    data:
                                        type: array

                                        items:
                                            type: object
                                            required:
                                                - providerId
                                                - operation
                                                - timestamp
                                                - fkMongoId
                                                - fkId
                                                - id
                                                - ozoneInteractionId

                                            properties:
                                                providerId:
                                                    type: string

                                                operation:
                                                    type: string
                                                    description: |
                                                        Like "create" or "patch"

                                                timestamp:
                                                    type: integer

                                                fkMongoId:
                                                    type: string
                                                    description: |
                                                        A unique identifier for the audit log in mongodb

                                                fkId:
                                                    type: string
                                                    description: |
                                                        A unique identifier for the consentId

                                                id:
                                                    type: string
                                                    description: |
                                                        A unique identifier for the audit log

                                                ozoneInteractionId:
                                                    type: string
                                                    description: |
                                                        The ozone interaction id assigned to the interaction that caused this changed. Useful for looking up the api-log

                                                callerDetails:
                                                    type: object
                                                    additionalProperties: false
                                                    properties:
                                                        callerOrgId:
                                                            type: string
                                                        callerClientId:
                                                            type: string
                                                        callerSoftwareStatementId:
                                                            type: string

                                                patchFilter:
                                                    type: string

                                                patch:
                                                    type: string
                                                    description: |
                                                        This shows what the ASPSP had "patched in" the `psuIdentifier` and `accountIds` associated with the consent

                                    meta:
                                        $ref: "#/components/schemas/meta"
                '400':
                    description: |
                        Indicates a failure to retrieve the consent's audit trail
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

    /consent-groups/{consentGroupId}/consents:
        get:
            tags:
                - consent-groups
            summary: Retrieves consents within a consent group
            description: |
                Retrieves an array of consents that are within a consent group.
                
                If no consents could be found, then an empty array is returned.

            operationId: getConsentsInConsentGroup

            parameters:
                - name: consentGroupId
                  in: path
                  schema:
                      type: string
                  required: true
                  description: |
                      Select consents within the consentGroupId

                - $ref: "#/components/parameters/consentType"
                - $ref: "#/components/parameters/status"
                - $ref: "#/components/parameters/page"
                - $ref: "#/components/parameters/pageSize"

            responses:
                '200':
                    description: |
                        Successful response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/multiConsentResponse"
                '400':
                    description: Indicates a failure to retrieve the consents
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

    /consent-groups/{consentGroupId}/consents/action/revoke:
        post:
            tags:
                - consent-groups
            summary: Revokes consents within a consent group
            description: |
                Revokes consents that are within a consent group.

            operationId: revokeConsentsInConsentGroup

            parameters:
                - name: consentGroupId
                  in: path
                  schema:
                      type: string
                  required: true
                  description: |
                      Select consents within the consentGroupId

            requestBody:
                description: |
                    An end-point for revoking a consent within a consent group.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RevokeConsent"

            responses:
                '204':
                    description: |
                        No Content

                '400':
                    description: Indicates a failure to revoke the consent
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

    /psu/{userId}/consents:
        get:
            tags:
                - consents
            summary: Retrieves all the consents associated with a given PSU
            description: |
                Retrieves an array of consents associated with the PSU.
                
                If no consents could be found associated with the PSU, then an empty array is returned.
                
                The userId path parameter is matched with the `psuIdentifiers.userId` field in the consent.
            operationId: getConsents
            parameters:
                - $ref: "#/components/parameters/userId"
                - $ref: "#/components/parameters/consentType"
                - $ref: "#/components/parameters/status"
                - $ref: "#/components/parameters/page"
                - $ref: "#/components/parameters/pageSize"

            responses:
                '200':
                    description: |
                        Successful response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/multiConsentResponse"
                '400':
                    description: Indicates a failure to retrieve the consents
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

    /psu/{userId}/deleted-consents:
        get:
            tags:
                - consents
            summary: Retrieve deleted consents of a user by its id
            description: |
                Retrieve deleted consents of a user by its id
            operationId: getUserIdDeletedConsents
            parameters:
                - $ref: "#/components/parameters/userId"
                - $ref: "#/components/parameters/page"
                - $ref: "#/components/parameters/pageSize"

            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/multiConsentResponse"
                '400':
                    description: |
                        Indicates a failure to retrieve the consent
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

    /accounts/{accountId}/consents:
        get:
            tags:
                - consents
            summary: Retrieve consents of a account by its id
            description: |
                Retrieve consents of a account by its id
            operationId: getAccountIdConsents
            parameters:
                - name: accountId
                  in: path
                  schema:
                      type: string
                  required: true
                  description: Identifier for the account

                - $ref: "#/components/parameters/consentType"
                - $ref: "#/components/parameters/status"
                - $ref: "#/components/parameters/page"
                - $ref: "#/components/parameters/pageSize"

            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/multiConsentResponse"

                '400':
                    description: |
                        Indicates a failure to create the consent
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

    /payment-log:
        get:
            tags:
                - payments
            summary: Retrieve a payment log by its consent id or account id
            operationId: getAuditConsentsByConsentIdw
            description: |
                Either one of the query parameters can be used, not both.
            parameters:
                - name: consentId
                  in: query
                  schema:
                      type: string
                  required: true
                  description: |
                      Identifier for the consent

                - name: accountId
                  in: query
                  schema:
                      type: string
                  required: true
                  description: |
                      Identifier for the account

            responses:
                '200':
                    description: successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - data
                                    - meta
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object

                                            required:
                                                - consentId
                                                - paymentType
                                                - paymentId
                                                - idempotencyKey
                                                - paymentResponse
                                                - tpp
                                                - accountId
                                                - psuIdentifiers
                                                - interactionId
                                                - authorizationCode
                                                - requestBody
                                                - requestHeaders

                                            properties:

                                                consentId:
                                                    type: string
                                                    description: |
                                                        A ConsentId generated by the ASPSP for the consent. This is different from the top-level `id` field which is used by Consent Manager.

                                                paymentType:
                                                    type: string
                                                    description: The underlying payment type

                                                paymentId:
                                                    type: string

                                                idempotencyKey:
                                                    type: integer

                                                paymentResponse:
                                                    type: object

                                                    properties:
                                                        id:
                                                            type: string
                                                            description: |
                                                                A unique payment for the consent in uuid-v4 format.

                                                        status:
                                                            type: string
                                                            description: |
                                                                The current status of the payment

                                                        creationDateTime:
                                                            type: string
                                                            pattern: ($date-time)
                                                            description: |
                                                                An ISO date-time representing when the consent was created

                                                        statusUpdateDateTime:
                                                            type: string
                                                            pattern: ($date-time)
                                                            description: |
                                                                An ISO date-time representing when the consent status was last updated

                                                        rejectionDetails:
                                                            description: |
                                                                This attribute SHOULD only be returned when the resource Status represents a failed state e.g. : Rejected.
                                                            type: object
                                                            required:
                                                                - Reason
                                                            properties:
                                                                Reason:
                                                                    type: object
                                                                    description: |
                                                                        A Placeholder for any responses that support a Status
                                                                    required:
                                                                        - Code
                                                                    properties:
                                                                        Code:
                                                                            type: string
                                                                            description: |
                                                                                The reason code that represents the downstream System Error.
                                                                                **Payments**
                                                                                
                                                                                |Status|Reason Code|Description|
                                                                                |----------|--|--|
                                                                                |Rejected|KSAOB.Originator.InsufficientFunds|The PASP Debtor Account does not have sufficient funds to complete the payment|
                                                                                |Rejected|KSAOB.Originator.AccountIssue|The Originator Account has an issue in sending the payment e.g. Account is inactive, locked, dormant|
                                                                                |Rejected|KSAOB.Receiver.AccountIssue|The Receiver Account has an issue in receiving the payment e.g. Account is inactive, locked, dormant|
                                                                                |Rejected|KSAOB.Originator.TransactionNotPermitted|The Originator Account is not permitted to perform the requested transaction|
                                                                                |Rejected|KSAOB.Originator.DuplicateTransaction|The requested transaction is a duplicate of a previous successfully processed transaction|
                                                                                |Rejected|KSAOB.Receiver.DuplicateTransaction|The requested transaction is a duplicate of a previous successfully processed transaction|
                                                                                |Rejected|KSAOB.Receiver.Timeout |A timeout has occurred on the payment rails|
                                                                                |Rejected|KSAOB.Receiver.SystemUnavailable|The payment rails or downstream system is unavailable|
                                                                                |Rejected|KSAOB.Originator.Other|Any other reason not specified and applicable to the Originator; details MUST be provided in the Detail field|
                                                                                |Rejected|KSAOB.Receiver.Other|Any other reason not specified and applicable to the Receiver; details MUST be provided in the Detail field|
                                                                                |Rejected|KSAOB.Originator.SuspectedFraud|The Originator Account has been suspended due to suspected fraud|
                                                                                |Rejected|KSAOB.Receiver.SuspectedFraud|The Receiver Account has been suspended due to suspected fraud|
                                                                                |Failed|KSAOB.Originator.SystemUnavailable|This is only for RTP.The payment rails or downstream system is unavailable|
                                                                                |Cancelled|KSAOB.Receiver.CancellationAccepted|This is only for RTP.The cancellation request has been accepted by the Receiver|
                                                                                |Expired|KSAOB.Originator.Expired|This is only for RTP.The Originator requested window for an RTP response has expired|
                                                                                |Failed|KSAOB.Originator.CancelledBeforeSubmission|This is only for RTP.The Originator PASP has not submitted the RTP request to the Receiver PASP due to invalid information|
                                                                            enum:
                                                                                - "KSAOB.Originator.InsufficientFunds"
                                                                                - "KSAOB.Originator.AccountIssue"
                                                                                - "KSAOB.Receiver.AccountIssue"
                                                                                - "KSAOB.Originator.TransactionNotPermitted"
                                                                                - "KSAOB.Originator.DuplicateTransaction"
                                                                                - "KSAOB.Receiver.DuplicateTransaction"
                                                                                - "KSAOB.Receiver.Timeout"
                                                                                - "KSAOB.Receiver.SystemUnavailable"
                                                                                - "KSAOB.Originator.Other"
                                                                                - "KSAOB.Receiver.Other"
                                                                                - "KSAOB.Originator.SuspectedFraud"
                                                                                - "KSAOB.Receiver.SuspectedFraud"
                                                                                - "KSAOB.Originator.SystemUnavailable"
                                                                                - "KSAOB.Receiver.CancellationAccepted"
                                                                                - "KSAOB.Originator.Expired"
                                                                                - "KSAOB.Originator.CancelledBeforeSubmission"
                                                                        Detail:
                                                                            type: "string"
                                                                            description: "Further details that are specific to the Reason Code"
                                                                    additionalProperties: false
                                                                Message:
                                                                    $ref: "#/components/schemas/OBMessage"
                                                            additionalProperties: false

                                                        instruction:
                                                            type: object
                                                            description: The current status of the payment. This is mandatory for KSA. The data will be passed without any validation.
                                                            oneOf:
                                                                - $ref: "#/components/schemas/KSAOBRefundInitiationInstructionResponse"
                                                                - $ref: "#/components/schemas/KSAOBRequestToPayInitiationInstructionResponse"

                                                signedResponse:
                                                    type: string

                                                tpp:
                                                    $ref: "#/components/schemas/tpp"

                                                accountId:
                                                    type: integer

                                                psuIdentifiers:
                                                    $ref: "#/components/schemas/psuIdentifiers"

                                                interactionId:
                                                    $ref: "#/components/schemas/apiLogInteractionId"

                                                authorizationCode:
                                                    type: object

                                                    properties:
                                                        paymentId:
                                                            type: string

                                                        accessTokenHash:
                                                            type: string

                                                        currentDateTime:
                                                            type: string
                                                            pattern: ($date-time)

                                                requestBody:
                                                    type: object
                                                    description: |
                                                        Describes the fields to be patched and their corresponding values.
                                                        
                                                        The fields that are supported differ based on the Api standard that the consent belongs to.
                                                    properties:
                                                        data:
                                                            type: object

                                                            properties:
                                                                cnpjInitiatori:
                                                                    type: integer

                                                                localInstrument:
                                                                    type: string

                                                                payment:
                                                                    type: object

                                                                    properties:
                                                                        currency:
                                                                            type: string

                                                                        amount:
                                                                            type: number

                                                                creditorAccount:
                                                                    type: object

                                                                    properties:
                                                                        ispb:
                                                                            type: integer

                                                                        issuer:
                                                                            type: integer

                                                                        number:
                                                                            type: integer

                                                                        accountType:
                                                                            type: string

                                                                remittanceInformation:
                                                                    type: string

                                                                cnpjInitiator:
                                                                    type: integer

                                                signedRequestBody:
                                                    type: string

                                                requestHeaders:
                                                    type: object
                                                    description: |
                                                        The entire set of Http request headers that was received by Ozone from the TPP
                                                    additionalProperties: true

                                    meta:
                                        $ref: "#/components/schemas/meta"
                '400':
                    description: |
                        Indicates a failure to retrieve the payments
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/errorResponse"

    /payment-log/{paymentId}:
        patch:
            tags:
                - payments
            summary: Patches one or more fields in a payment-log
            description: |
                This operation allows an  modify fields within a payment's `paymentResponse`.

            operationId: patchPymentlog
            parameters:
                - $ref: "#/components/parameters/paymentId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/patchPaymentRecordBody"

            responses:
                '200':
                    description: successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - data
                                    - meta
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object

                                            required:
                                                - consentId
                                                - paymentType
                                                - paymentId
                                                - idempotencyKey
                                                - paymentResponse
                                                - tpp
                                                - accountId
                                                - psuIdentifiers
                                                - interactionId
                                                - authorizationCode
                                                - requestBody
                                                - requestHeaders

                                            properties:

                                                consentId:
                                                    type: string
                                                    description: |
